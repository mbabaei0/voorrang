<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Puzzle interaction prototype</title>
    <style>
      :root { --ink: #1b1f24; --muted: #5d6670; --sheet: #ffffff; --line: #d9dee3; --accent: #1f6feb; --good: #1a7f37; --bad: #cf222e; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #dfe7ec; color: var(--ink); font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
      #app { display: grid; grid-template-rows: minmax(0, 1fr) auto; height: 100%; }
      #stage { position: relative; min-height: 0; }
      #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
      #labels { position: absolute; inset: 0; pointer-events: none; }
      .badge { min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: var(--accent); color: #fff;
        font: 700 14px/26px system-ui, sans-serif; text-align: center; box-shadow: 0 1px 3px rgb(0 0 0 / 0.35); }
      .badge.tied { background: #8250df; }
      .badge.wrong { background: var(--bad); }
      #top { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
      #top button, #top select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgb(255 255 255 / 0.92); color: var(--ink); }
      #top button[aria-pressed="true"] { background: var(--ink); color: #fff; }
      #fps { margin: 0; font: 12px/1.3 ui-monospace, monospace; color: var(--muted); }
      #sheet { background: var(--sheet); border-top: 1px solid var(--line); padding: 12px 16px max(12px, env(safe-area-inset-bottom)); display: grid; gap: 10px; }
      /* The prompt keeps its slot and the tray its height, and feedback floats over the scene, so the scene never jumps. */
      #prompt { margin: 0; color: var(--muted); min-height: 2.8em; }
      #title { margin: 0; font-size: 17px; }
      #tray { display: flex; flex-wrap: wrap; align-items: center; align-content: flex-start; gap: 4px; min-height: 84px; }
      .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 20px; border: 1px solid var(--line);
        background: #f6f8fa; font: inherit; color: var(--ink); touch-action: none; user-select: none; }
      .chip .swatch { width: 12px; height: 12px; border-radius: 3px; }
      .chip .num { font-weight: 700; }
      .chip.placed { background: #ddf4ff; border-color: #54aeff; }
      .chip.dragging { opacity: 0.6; }
      .link { width: 30px; height: 30px; border-radius: 15px; border: 1px dashed var(--line); background: none; font: 600 13px system-ui; color: var(--muted); }
      .link[aria-pressed="true"] { border-style: solid; border-color: #8250df; color: #8250df; background: #fbefff; }
      #actions { display: flex; gap: 8px; }
      #actions button { flex: 1; font: 600 15px system-ui; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: #f6f8fa; color: var(--ink); }
      #actions button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      #actions button:disabled { opacity: 0.45; }
      #feedback { position: absolute; left: 8px; right: 8px; bottom: 8px; margin: 0; padding: 10px 12px; border-radius: 10px; box-shadow: 0 2px 10px rgb(0 0 0 / 0.15); }
      #feedback.good { background: #dafbe1; color: var(--good); }
      #feedback.bad { background: #ffebe9; color: var(--bad); }
      #feedback[hidden] { display: none; }
      #settings { flex-basis: 100%; max-width: 420px; background: var(--sheet); border-radius: 12px; padding: 12px;
        box-shadow: 0 6px 24px rgb(0 0 0 / 0.2); display: grid; gap: 10px; }
      #settings[hidden] { display: none; }
      #settings fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 12px; }
      #settings legend { font-weight: 600; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="labels"></div>
        <div id="top">
          <select id="scenario" aria-label="Scenario"></select>
          <button id="cam-overhead" data-camera="overhead">Top</button>
          <button id="cam-angled" data-camera="angled">Angled</button>
          <button id="cam-you" data-camera="you">You</button>
          <button id="open-settings" aria-expanded="false">Variants</button>
          <form id="settings" hidden>
            <fieldset>
              <legend>Choose the order by</legend>
              <label><input type="radio" name="input" value="scene" checked /> tapping in the scene</label>
              <label><input type="radio" name="input" value="tray" /> tapping chips in the tray</label>
            </fieldset>
            <fieldset>
              <legend>Ties</legend>
              <label><input type="radio" name="ties" value="links" checked /> link buttons between chips</label>
              <label><input type="radio" name="ties" value="strict" /> none (strict CBR 1-2-3)</label>
            </fieldset>
            <fieldset>
              <legend>Camera</legend>
              <label><input type="checkbox" name="orbit" /> allow orbit (drag to turn)</label>
            </fieldset>
            <fieldset>
              <legend>Replay speed</legend>
              <label><input type="radio" name="speed" value="0.5" /> 0.5×</label>
              <label><input type="radio" name="speed" value="1" checked /> 1×</label>
              <label><input type="radio" name="speed" value="2" /> 2×</label>
            </fieldset>
            <fieldset>
              <legend>On a wrong answer</legend>
              <label><input type="radio" name="crash" value="slowmo" checked /> slow down into the conflict, then stop</label>
              <label><input type="radio" name="crash" value="stop" /> stop at the conflict</label>
            </fieldset>
            <p id="fps">Frame timing appears here after a replay.</p>
          </form>
        </div>
        <p id="feedback" aria-live="polite" hidden></p>
      </div>
      <div id="sheet">
        <h1 id="title"></h1>
        <div id="tray" aria-label="Passing order"></div>
        <p id="prompt"></p>
        <div id="actions">
          <button id="clear" type="button">Clear</button>
          <button id="check" type="button" class="primary" disabled>Check</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/puzzle/main.ts"></script>
  </body>
</html>
