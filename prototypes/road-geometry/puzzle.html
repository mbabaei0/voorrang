<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Puzzle · Voorrang</title>
    <meta name="theme-color" content="#e8ebe7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f2225" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/design/system.css" />
    <link rel="stylesheet" href="/src/design/app.css" />
  </head>
  <body class="app">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="brand-mark" viewBox="0 0 36 36">
        <rect width="36" height="36" rx="7" style="fill: var(--ink)" />
        <path d="M5 12h7.3l-3.65 10zM14.35 12h7.3L18 22zM23.7 12H31l-3.65 10z" style="fill: var(--bg)" />
      </symbol>
    </svg>

    <header class="site-header" style="padding-inline: var(--gutter)">
      <a class="brand" href="./">
        <svg class="brand-mark" aria-hidden="true"><use href="#brand-mark" /></svg>
        Voorrang
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="puzzle.html" aria-current="page">Puzzle</a>
        <a href="rules.html">Rules</a>
      </nav>
    </header>

    <main id="app" class="workspace">
      <div id="stage" class="stage">
        <div id="labels" class="stage-labels"></div>
        <div id="top" class="stage-tools">
          <select id="scenario" class="select" aria-label="Scenario"></select>
          <div class="segmented" role="group" aria-label="Camera">
            <button id="cam-overhead" class="tool" type="button" data-camera="overhead">Top</button>
            <button id="cam-angled" class="tool" type="button" data-camera="angled">Angled</button>
            <button id="cam-you" class="tool" type="button" data-camera="you">You</button>
          </div>
          <button id="open-settings" class="tool" type="button" aria-expanded="false" aria-controls="settings">Settings</button>
          <form id="settings" class="panel" hidden>
            <fieldset>
              <legend>Choose the order by</legend>
              <label><input type="radio" name="input" value="tray" checked /> The list, or tapping in the scene</label>
              <label><input type="radio" name="input" value="scene" /> Tapping in the scene only</label>
            </fieldset>
            <fieldset>
              <legend>Road users who go together</legend>
              <label><input type="radio" name="ties" value="links" /> Allow, with a link between them</label>
              <label><input type="radio" name="ties" value="strict" checked /> Don’t allow (strict CBR 1-2-3)</label>
            </fieldset>
            <fieldset>
              <legend>Camera</legend>
              <label><input type="checkbox" name="orbit" /> Drag to turn the view</label>
            </fieldset>
            <fieldset>
              <legend>Replay speed</legend>
              <label><input type="radio" name="speed" value="0.5" /> 0.5×</label>
              <label><input type="radio" name="speed" value="1" /> 1×</label>
              <label><input type="radio" name="speed" value="1.5" checked /> 1.5×</label>
              <label><input type="radio" name="speed" value="2" /> 2×</label>
            </fieldset>
            <fieldset>
              <legend>On a wrong answer</legend>
              <label><input type="radio" name="crash" value="slowmo" checked /> Slow down into the crash, then stop</label>
              <label><input type="radio" name="crash" value="stop" /> Stop at the crash</label>
            </fieldset>
            <p id="fps" class="t-cite">Frame timing appears here after a replay.</p>
          </form>
        </div>
        <div id="feedback" class="stage-feedback feedback" role="status" aria-live="polite" hidden></div>
      </div>

      <aside id="sheet" class="sheet" aria-labelledby="title">
        <h1 id="title"></h1>
        <p id="prompt" class="prompt"></p>
        <div id="tray" class="tray" role="group" aria-label="Passing order"></div>
        <div id="actions" class="actions">
          <button id="check" type="button" class="btn btn--action" disabled>Check</button>
          <button id="clear" type="button" class="btn btn--quiet">Clear</button>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/puzzle/main.ts"></script>
  </body>
</html>
